:root{--bg:#f1f7f4;--c1:#fff;--c2:#e9f5ef;--tx:#14302a;--mu:#6b8079;--ac:#22a373;--ac2:#d6f0e5;--bd:#dbeae3;--bar:rgba(255,255,255,.88);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

  if(!r.date||!(Object.keys(r.vals).length+Object.keys(r.q).length))throw new Error('abrió, pero no reconocí '+(r.date?'los exámenes':'la fecha')+'. Texto leído: '+lines.slice(0,8).join(' | ').slice(0,300));
  const hit=r.doc&&Object.keys(DB.people).find(id=>DB.people[id].pid===r.doc||String(DB.people[id].doc).replace(/\D/g,'')===r.doc);
  if(hit){S=DB.people[hit];DB.cur=hit}
  else if(r.doc&&(Object.keys(S.ex).length||S.pid)){if(!confirm('Este PDF es de '+title(r.name)+', otra persona. ¿Crear un perfil nuevo?'))throw new Error('omitido: es de otra persona ('+title(r.name)+')');const id='p'+Date.now();S={doc:r.doc,name:'',age:null,sex:'',ex:{}};DB.cur=id;DB.people[id]=S}
  const e=S.ex[r.date]=S.ex[r.date]||{vals:{}};Object.assign(e.vals,r.vals);e.q=Object.assign(e.q||{},r.q);
  if(r.name){S.name=r.name;if(!S.sex)S.sex=guessSex(r.name)}if(r.sex)S.sex=r.sex;if(r.doc)S.pid=r.doc;
  if(r.doc&&!S.doc)S.doc=r.doc;
  if(!S.lastDate||r.date>=S.lastDate){S.lastDate=r.date;if(r.age)S.age=r.age}
  LOG.push('✅ '+title(S.name)+' · '+dl(r.date)+' · '+(Object.keys(r.vals).length+Object.keys(r.q).length)+' resultados')}
  catch(e){LOG.push('⚠️ '+f.name+': '+(e.name==='PasswordException'?'la clave (número de documento) no abrió el archivo':e.message||'no se pudo leer'))}}
 save();draw()}

async function readAny(f){let er;for(const p of new Set([S.doc,...Object.values(DB.people).map(x=>x.doc)].filter(Boolean).map(x=>String(x).replace(/\D/g,'')))){try{return await readPdf(f,p)}catch(e){if(e.name!=='PasswordException')throw e;er=e}}
 if(!er)return readPdf(f,'');throw er}
const ds=()=>Object.keys(S.ex).sort();
const qRows=(c,f,t)=>Q.filter(x=>x[3]===c).map(x=>({x,rows:ds().filter(d=>(!f||d>=f)&&(!t||d<=t)&&S.ex[d].q&&S.ex[d].q[x[0]]).reverse().map(d=>({d,v:S.ex[d].q[x[0]]}))})).filter(g=>g.rows.length);
const qCount=c=>qRows(c).reduce((a,g)=>a+g.rows.length,0);
const qTable=(c,f,t)=>{const g=qRows(c,f,t);if(!g.length)return'';return '<h2 style="font-size:18px">Resultados sin gráfica</h2><div class="card"><div class="qt"><div class="hd">Examen</div><div class="hd">Fecha</div><div class="hd">Resultado</div>'+g.map(o=>o.rows.map((r,i)=>(i?'':'<div style="grid-row:span '+o.rows.length+'"><b>'+o.x[2]+'</b><span class="mu" style="font-size:12px">'+o.x[4]+'</span></div>')+'<div class="mu">'+dls(r.d)+'</div><div style="align-items:flex-start"><span class="chip'+(qBad(r.v)?' w':'')+'">'+esc(r.v)+'</span></div>').join('')).join('')+'</div></div>'};
const outKeys=()=>{const d=ds(),l=d[d.length-1];if(!l)return[];return Object.keys(T).filter(k=>{if(!S.ex[l].vals[k])return false;const s=series(k),R=rngs(k,s),i=s.length-1;return st(s[i].v,R[i][0],R[i][1])!==0})};
const goOut=()=>{if(!outKeys().length)return;V.p='graf';V.only=outKeys();draw()};
const series=(k,f,t)=>ds().filter(d=>S.ex[d].vals[k]&&(!f||d>=f)&&(!t||d<=t)).map(d=>({d,...S.ex[d].vals[k]}));
function rngs(k,s){const a=s.map(p=>p.lo!=null?[p.lo,p.hi]:null);let c=null;
 for(let i=0;i<a.length;i++){if(a[i])c=a[i];else a[i]=c}c=null;
 for(let i=a.length-1;i>=0;i--){if(a[i])c=a[i];else a[i]=c||[T[k][3],T[k][4]]}return a}
const lastSt=k=>{const s=series(k);if(!s.length)return null;const r=rngs(k,s),i=s.length-1;return st(s[i].v,r[i][0],r[i][1])};
const chipFor=z=>z===0?'<span class="chip">En rango</span>':'<span class="chip '+(z>0?'b':'w')+'">'+(z>0?'Alto':'Bajo')+'</span>';

function chart(k,s){
 const R=rngs(k,s),W=320,H=190,L=42,Rr=22,Tp=24,B=30,id='ar'+k,vs=s.map(p=>p.v);R.forEach(r=>vs.push(r[0],r[1]));
 let a=Math.min(...vs),b=Math.max(...vs);const pd=(b-a||1)*.12;a=a>=0?Math.max(0,a-pd):a-pd;b+=pd;
 const y=v=>Tp+(H-Tp-B)*(1-(v-a)/(b-a)),t0=new Date(s[0].d),t1=new Date(s[s.length-1].d);
 const xs=s.length<2?[(L+W-Rr)/2]:s.map(p=>L+(W-L-Rr)*(new Date(p.d)-t0)/((t1-t0)||1));
 const bx=s.length<2?[L,W-Rr]:xs,br=s.length<2?[R[0],R[0]]:R;
 let o='<svg viewBox="0 0 '+W+' '+H+'" width="100%"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fbf8a" stop-opacity=".35"/><stop offset="1" stop-color="#2fbf8a" stop-opacity="0"/></linearGradient></defs>';
 for(let i=0;i<4;i++){const v=a+(b-a)*i/3;o+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="currentColor" opacity=".12"/><text x="'+(L-6)+'" y="'+(y(v)+3)+'" font-size="10" text-anchor="end" fill="#8aa39a">'+(+v.toPrecision(3))+'</text>'}
 o+='<polygon fill="#2fbf8a" opacity=".2" points="'+bx.map((x,i)=>x+','+y(br[i][1])).join(' ')+' '+bx.map((x,i)=>x+','+y(br[i][0])).reverse().join(' ')+'"/>';
 o+='<polyline fill="none" stroke="#2fbf8a" stroke-width="1" stroke-dasharray="3 3" opacity=".7" points="'+bx.map((x,i)=>x+','+y(br[i][1])).join(' ')+'"/><polyline fill="none" stroke="#2fbf8a" stroke-width="1" stroke-dasharray="3 3" opacity=".7" points="'+bx.map((x,i)=>x+','+y(br[i][0])).join(' ')+'"/>';
 const P=s.map((p,i)=>[xs[i],y(p.v)]);
 if(P.length>1){let d='M'+P[0];for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;d+=' C'+[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1]]}
  o+='<path d="'+d+' L'+P[P.length-1][0]+','+(H-B)+' L'+P[0][0]+','+(H-B)+' Z" fill="url(#'+id+')"/><path d="'+d+'" fill="none" stroke="#2fbf8a" stroke-width="3" stroke-linecap="round"/>'}
 s.forEach((p,i)=>{const z=st(p.v,R[i][0],R[i][1]),c=['#e08a1e','#2fbf8a','#e5604d'][z+1];
  o+='<circle cx="'+P[i][0]+'" cy="'+P[i][1]+'" r="5.5" fill="'+c+'" style="stroke:var(--c2)" stroke-width="2.5"/><text x="'+P[i][0]+'" y="'+(P[i][1]-11)+'" font-size="11" font-weight="700" text-anchor="middle" fill="currentColor">'+fmt(p.v)+'</text>';
  if(s.length<=6||i%2===0)o+='<text x="'+P[i][0]+'" y="'+(H-9)+'" font-size="10" text-anchor="middle" fill="#8aa39a">'+ml(p.d)+'</text>'});
 return o+'</svg>'}

function sil(sx){const f=sx==='F';
 const g='<defs><linearGradient id="sg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="160"><stop offset="0" stop-color="#4a8bf0"/><stop offset="1" stop-color="#2fbf8a"/></linearGradient></defs>';
 const body=f?'<path d="M38 40 Q50 35 62 40 L60 62 Q57 74 66 100 L34 100 Q43 74 40 62 Z" fill="url(#sg)"/><g stroke="url(#sg)" stroke-linecap="round" fill="none"><path d="M36 44 L29 82" stroke-width="6"/><path d="M64 44 L71 82" stroke-width="6"/><path d="M45 100 L44 146" stroke-width="7.5"/><path d="M55 100 L56 146" stroke-width="7.5"/></g>'
 :'<path d="M30 40 Q50 33 70 40 L66 98 L34 98 Z" fill="url(#sg)"/><g stroke="url(#sg)" stroke-linecap="round" fill="none"><path d="M30 46 L25 90" stroke-width="8"/><path d="M70 46 L75 90" stroke-width="8"/><path d="M43 98 L42 146" stroke-width="10"/><path d="M57 98 L58 146" stroke-width="10"/></g>';
 return '<div class="av"><svg viewBox="0 0 100 156" width="84">'+g+'<circle cx="50" cy="20" r="12" fill="url(#sg)"/><rect x="46" y="30" width="8" height="9" rx="3" fill="url(#sg)"/>'+body+'</svg></div>'}

function setup(){return '<img src="'+document.querySelector('link[rel=apple-touch-icon]').href+'" width="76" height="76" style="border-radius:20px;margin-top:8px"><h1 style="margin-top:12px">Salute e vita</h1><p class="mu">Seguimiento de tus exámenes médicos</p><div class="card"><b class="h">Primer paso: la clave de los PDF</b><p class="mu">Muchos laboratorios envían los resultados protegidos con contraseña. Normalmente la clave es el <b>número de documento</b> del paciente, solo números, sin puntos ni letras (por ejemplo 1234567).</p><ol class="mu"><li>Escribe el documento abajo.</li><li>Carga los PDF de resultados.</li><li>La app los abre, lee fechas y valores y arma las gráficas.</li></ol><input id="doc" type="tel" inputmode="numeric" placeholder="Ej. 1234567"><button class="btn" onclick="const v=document.getElementById(\'doc\').value.replace(/\\D/g,\'\');if(v)newP()">Continuar</button>'+(Object.keys(DB.people).length?'<button class="btn g" style="margin-top:10px" onclick="go(\'home\')">Cancelar</button>':'')+'<p class="mu">🔒 Todo se queda guardado solo en este teléfono. Nada se sube a internet.</p></div>'}

function home(){
 const d=ds(),last=d[d.length-1],obs=[],out=[];
 out.push(...outKeys());
 if(last){const dd=Math.round((Date.now()-new Date(last))/864e5);obs.push(dd>150?'🗓️ Han pasado '+dd+' días desde el último examen ('+dl(last)+'). Podría ser momento de programar un control.':'🗓️ Último examen hace '+dd+' días ('+dl(last)+').');
  obs.push(out.length?'📌 Fuera de rango en el último examen: '+out.map(k=>T[k][1].replace(/ \(.*\)/,'')).join(', ')+'.':'✅ Todos los valores del último examen están en rango.')}
 else obs.push('Aún no hay exámenes. Carga los PDF para comenzar.');
 const cats=Object.keys(C).map(c=>{const ks=Object.keys(T).filter(k=>T[k][5]===c&&series(k).length);const qn=qCount(c);if(!ks.length&&!qn)return'';
  const n=ks.filter(k=>out.includes(k)).length;
  return '<button class="cat" onclick="go(\'graf\',\''+c+'\')"><span class="e">'+C[c][0]+'</span><b>'+C[c][1]+'</b><span class="mu">'+(ks.length?(n?n+' fuera de rango':'Todo en rango'):qn+' resultados')+'</span></button>'}).join('');
 return '<h1>Inicio</h1>'+ppl()+'<div class="card"><div class="row">'+sil(S.sex)+'<div><div class="big" style="font-size:22px;line-height:1.2">'+esc(title(S.name||'Paciente'))+'</div><p class="mu">'+(S.age?S.age+' años · ':'')+'Doc. '+esc(S.doc)+'</p>'+
 '<div class="row" style="gap:6px;margin-top:6px"><button class="pill'+(S.sex==='F'?' on':'')+'" style="padding:6px 14px;font-size:14px" onclick="S.sex=\'F\';save();draw()">Mujer</button><button class="pill'+(S.sex==='M'?' on':'')+'" style="padding:6px 14px;font-size:14px" onclick="S.sex=\'M\';save();draw()">Hombre</button></div></div></div>'+
 '<div class="stats"><div class="st"><b>'+d.length+'</b><span>Exámenes</span></div><div class="st"><b>'+(last?ml(last):'–')+'</b><span>Último</span></div><button class="st" style="border:0;color:inherit;font:inherit" onclick="goOut()"><b>'+out.length+'</b><span>Fuera de rango'+(out.length?' ›':'')+'</span></button></div></div>'+
 '<div class="card">'+obs.map(o=>'<p>'+o+'</p>').join('')+'<p class="mu" style="font-size:12px">Información de apoyo, no reemplaza la valoración del médico.</p></div>'+
 '<button class="btn" onclick="go(\'cargar\')">＋ Cargar resultados</button>'+(cats?'<h2>Categorías</h2><div class="grid">'+cats+'</div>':'')}

function graf(){
 const d=ds();if(!d.length)return '<h1>Gráficas</h1><div class="card"><p class="mu">Aún no hay exámenes cargados.</p><button class="btn" onclick="go(\'cargar\')">Cargar resultados</button></div>';
 const f=V.f||d[0],t=V.t||d[d.length-1],op=sel=>d.map(x=>'<option value="'+x+'"'+(x===sel?' selected':'')+'>'+ml(x)+'</option>').join('');
 const pills=Object.keys(C).sort((a,b)=>(b===V.c)-(a===V.c)).map(c=>'<button class="pill'+(V.c===c?' on':'')+'" onclick="go(\'graf\',\''+c+'\')">'+C[c][0]+' '+C[c][1]+'</button>').join('');
 const cards=(V.only||Object.keys(T).filter(k=>T[k][5]===V.c)).map(k=>{const s=series(k,f,t);if(!s.length)return'';const R=rngs(k,s),i=s.length-1,p=s[i],q=s[i-1],df=q?p.v-q.v:null;
  return '<div class="card"><div class="row sp"><b class="h">'+T[k][1]+'</b>'+chipFor(st(p.v,R[i][0],R[i][1]))+'</div><p class="mu" style="margin:2px 0 4px">'+(D[k]||'')+'</p><div class="row" style="margin:6px 0 2px;align-items:baseline"><span class="big">'+fmt(p.v)+'</span><span class="mu">'+T[k][2]+'</span></div><p class="mu">Rango de ese examen: '+R[i][0]+' – '+R[i][1]+(df!=null?' · vs. anterior: '+(df>0?'▲ +':df<0?'▼ ':'= ')+fmt(df):'')+'</p>'+chart(k,s)+'</div>'}).join('');
 return '<h1>Gráficas</h1><div class="sel"><div><label>Desde</label><select onchange="V.f=this.value;draw()">'+op(f)+'</select></div><div><label>Hasta</label><select onchange="V.t=this.value;draw()">'+op(t)+'</select></div></div>'+(V.only?'<div class="scroll"><button class="pill" onclick="go(\'graf\',V.c)">‹ Ver por categoría</button></div><h2 style="margin-top:4px">📌 Fuera de rango</h2><p class="mu" style="margin-top:-6px">Exámenes fuera de rango en el último examen</p>':'<div class="scroll">'+pills+'</div><h2 style="margin-top:4px">'+C[V.c][0]+' '+C[V.c][1]+'</h2><p class="mu" style="margin-top:-6px">'+C[V.c][2]+'</p>')+(cards||(V.only||qTable(V.c,f,t)?'':'<div class="card"><p class="mu">No hay datos de esta categoría en el período.</p></div>'))+(V.only?'':qTable(V.c,f,t))+'<p class="mu">La banda verde es el rango normal que indicó el laboratorio en cada examen.</p>'}

function cargar(){return '<h1>Cargar</h1><div class="card"><p class="mu">Elige uno o varios PDF de resultados. Si ya cargaste un examen, se actualiza sin duplicarse.</p><label class="btn">📄 Elegir PDF<input type="file" accept="application/pdf" multiple hidden onchange="load([...this.files])"></label></div>'+(LOG.length?'<div id="msg" class="card">'+LOG.map(l=>'<div>'+esc(l)+'</div>').join('')+'<button class="btn g" style="margin-top:10px" onclick="go(\'home\')">Ver resumen</button></div>':'')}
function cfg(){const ids=Object.keys(DB.people);return '<h1>Ajustes</h1><div class="card"><b class="h">Personas</b>'+(ids.length?ids.map(id=>{const p=DB.people[id];return '<div class="row sp" style="padding:10px 0;border-bottom:1px solid var(--bd)"><div><b>'+esc(title(p.name||'Sin nombre'))+(id===DB.cur?' ✓':'')+'</b><p class="mu" style="margin:0">Doc. '+esc(p.doc)+' · '+Object.keys(p.ex||{}).length+' exámenes</p></div><div class="row" style="gap:6px"><button class="pill" style="padding:8px 14px;font-size:14px" onclick="swP(\''+id+'\');go(\'home\')">Ver</button><button class="pill" style="padding:8px 14px;font-size:14px;color:#d24a3a" onclick="delPid(\''+id+'\')">Eliminar</button></div></div>'}).join(''):'<p class="mu">No hay personas.</p>')+'<button class="btn g" style="margin-top:12px" onclick="go(\'nueva\')">＋ Agregar persona</button></div><div class="card"><b class="h">Clave de los PDF</b><p class="mu">Documento de la persona seleccionada.</p><input id="doc" type="tel" value="'+esc(S.doc)+'"><button class="btn g" onclick="S.doc=document.getElementById(\'doc\').value.replace(/\\D/g,\'\');save();go(\'home\')">Guardar documento</button></div>'}

const ppl=(all)=>{const ids=Object.keys(DB.people);return ids.length<2&&!all?'':'<div class="scroll">'+ids.map(id=>'<button class="pill'+(id===DB.cur?' on':'')+'" onclick="swP(\''+id+'\')">'+esc(title((DB.people[id].name||'Persona').split(' ').slice(-2).join(' ')))+'</button>').join('')+'</div>'};
const swP=id=>{S=DB.people[id];DB.cur=id;V={p:V.p==='cfg'?'cfg':'home',c:V.c,f:'',t:''};save();draw()};
function newP(){const v=document.getElementById('doc').value.replace(/\D/g,'');if(!v)return;const id='p'+Date.now();S={doc:v,name:'',age:null,sex:'',ex:{}};DB.cur=id;DB.people[id]=S;save();go('cargar')}
function delPid(id){const p=DB.people[id];if(!p||!confirm('¿Eliminar a '+title(p.name||'esta persona')+' y todos sus exámenes? No se puede deshacer.'))return;delete DB.people[id];if(DB.cur===id)DB.cur=Object.keys(DB.people)[0]||'';S=DB.people[DB.cur]||{doc:'',name:'',age:null,sex:'',ex:{}};save();draw()}
function delP(){delete DB.people[DB.cur];DB.cur=Object.keys(DB.people)[0]||'';S=DB.people[DB.cur]||{doc:'',name:'',age:null,sex:'',ex:{}};save();go('home')}
function draw(){const a=document.getElementById('app'),n=document.getElementById('nav');
 a.innerHTML=(!S.doc||V.p==='nueva')?setup():({graf,cargar,cfg}[V.p]||home)();
 n.style.display=(S.doc&&V.p!=='nueva')?'flex':'none';
 n.innerHTML=[['home','🏠','Inicio'],['graf','📈','Gráficas'],['cargar','📄','Cargar'],['cfg','⚙️','Ajustes']].map(t=>'<button class="'+(V.p===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"><i>'+t[1]+'</i>'+t[2]+'</button>').join('');
 window.scrollTo(0,0)}
draw();
</script></body></html>
